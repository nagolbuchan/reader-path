librarian_task:
  description: >
    Conduct a thorough search for books on {topic} (category: {category}).
    Compile a list of **at least 24 and no more than 40 books** from the verified
    catalog tool (Google Books + Open Library) only.

    You are given a VERIFIED_BOOKS seed catalog below. Prefer those IDs. Use the
    verified search tool with refined sub-queries to expand coverage for 4–6 modules
    with ≥4 distinct readings each.

    VERIFIED_BOOKS:
    {verified_books}

    HARD RULES:
    - ONLY include books returned by the verified search tool or listed in VERIFIED_BOOKS.
    - Never invent titles, authors, or links.
    - Every book MUST include a stable ID (GoogleBooksID and/or OpenLibraryID), title,
      authors, brief summary, link, and ISBN13 when available.
    - Never include books without a valid ID and link.
    - Prefer unique titles; never list the same work twice (same ID, ISBN, or title).
    - Mark each book as Primary or Secondary when relevant.

    Category-specific search focus:
    - history: prioritize the earliest writings on the topic (chronicles, letters, treatises,
      law, poetry, memoirs from the period). Include at least 8 labeled primary sources.
      Prefer period texts and early translations over modern surveys when searching.
      When listing books, note approximate Year when known and lean earliest-first.
    - sciences: prioritize first-principles foundations and rigorous practice texts for STEM/
      engineering (not hands-on trades). Prefer works that teach underlying principles, derivation,
      and problem-solving over pop-science surveys. Include founder/classical works plus modern
      textbooks, problem books, and handbooks that build practitioners.    - trade_craft: practice manuals, handbooks, technique books; also a few craft-history /
      master-craftsperson works.
    - philosophy: prioritize primary philosophical texts and major commentaries.
    - literature: primary literary works (novels, poetry, drama) plus serious criticism/anthologies.
    - languages: grammars, graded readers, textbooks, and vocabulary/reference works.
    - professional: casebooks, practice handbooks, standards, and professional textbooks.
    - religion_theology: canonical/scriptural texts, theology, and reputable commentary
      (not only popular overviews).
    - other: balanced introductory through advanced works; verified books only.
  expected_output: >
    A structured list of at least 24 books each with stable IDs, title, author, brief summary,
    link, optional ISBN13, and Primary/Secondary label — all from verified catalogs only.
  agent: librarian

course_creator_task:
  description: >
    Using ONLY the verified book list (with Google Books and/or Open Library IDs) from the
    librarian, create a comprehensive course on {topic} (category: {category}).
    Break it into 4-6 logical modules.

    For each module include:
    - Module title
    - Learning objectives
    - Assigned readings (with google_books_id and/or open_library_id, isbn13 when known,
      title, authors, link) — **at least 4 real books**
    - Thoughtful written/research assignments that require reading those sources (not AI summaries)
    - `is_primary_sources_only`: boolean
    - `is_legacy_module`: boolean

    HARD RULES for readings:
    - Every reading MUST come from the librarian's verified list and MUST include at least one
      of `google_books_id` or `open_library_id` (include both and isbn13 when available).
    - Never invent books or links. If a book is not on the list, do not use it.
    - Every module MUST have **at least 4** objects in `assigned_readings`.
    - **No duplicate books anywhere in the course** — each ID, ISBN, and title may appear in
      at most one module, exactly once. Do not reuse a book across modules.
    Category rules (non-negotiable):
    - history:
        * ≥1 module with `is_primary_sources_only: true` (period primary sources / translations only).
        * Structure the whole course **chronologically**: modules progress from earliest period
          writings to later sources and modern scholarship.
        * Within each module, order `assigned_readings` earliest→latest by composition/publication
          (use Year from the verified list when provided).
        * Prefer the earliest available writings on the topic first (e.g. for the Reconquista,
          start with contemporary Iberian/Andalusi/Christian chronicles before modern historians).
        * Include `published_year` on readings when the catalog provides Year.
    - sciences:
        * **first** module `is_legacy_module: true` (founders / early foundational works that
          established the field's first principles).
        * Later modules (`is_legacy_module: false`) build toward mastery as a **first-principles
          thinker and practitioner**: prioritize rigorous textbooks, theory-from-fundamentals,
          worked problems, labs/design practice, and handbooks—not superficial overviews.
        * Prefer books that explain *why* (mechanisms, derivations, models) and books that train
          *doing* (exercises, projects, applied design) over popularizations.
        * Sequence modules from core principles → methods/tools → applied practice / systems.
    - trade_craft: **first** module `is_legacy_module: true` (history/legacy of the craft or master
      voices); later modules modern manuals and technique books for mastery.
    - philosophy: ≥1 module with `is_primary_sources_only: true` devoted to core philosophical texts
      (not only secondary surveys).
    - literature: ≥1 module with `is_primary_sources_only: true` of primary literary works; other
      modules may mix works and criticism.
    - languages: no forced primary-only module; sequence from foundations (grammar/phonology) to
      graded reading and advanced usage; use readers and textbooks heavily.
    - professional: optional first `is_legacy_module` if foundational theorists matter; emphasize
      casebooks, standards, and practice texts for mastery.
    - religion_theology: ≥1 module with `is_primary_sources_only: true` of canonical/scriptural
      (or foundational doctrinal) texts; later modules theology and commentary.
    - other: balanced curriculum; no forced primary-only or legacy module; verified books only.

    Return ONLY a valid JSON object (no markdown) with this exact shape:
    {{
      "title": "string",
      "description": "string",
      "topic": "{topic}",
      "category": "{category}",
      "modules": [
        {{
          "module_title": "string",
          "learning_objectives": ["string"],
          "is_primary_sources_only": false,
          "is_legacy_module": false,
          "assigned_readings": [
            {{"title": "string", "authors": "string", "link": "string", "google_books_id": "string", "open_library_id": "string", "isbn13": "string", "published_year": 1250}},
            {{"title": "string", "authors": "string", "link": "string", "google_books_id": "string", "open_library_id": "string", "isbn13": "string", "published_year": 1492}},
            {{"title": "string", "authors": "string", "link": "string", "google_books_id": "string", "open_library_id": "string", "isbn13": "string", "published_year": 1850}},
            {{"title": "string", "authors": "string", "link": "string", "google_books_id": "string", "open_library_id": "string", "isbn13": "string", "published_year": 1998}}
          ],
          "assignments": [
            {{"assignment_title": "string", "description": "string"}}
          ]
        }}
      ]
    }}
  expected_output: >
    A valid JSON course with category-appropriate modules, at least 4 verified readings per module
    each including google_books_id and/or open_library_id (plus isbn13/published_year when known),
    chronological ordering for history courses, and no invented books.
  agent: course_creator
  context:
    - librarian_task
