librarian_task:
  description: >
    Conduct a thorough search for books on {topic} (category: {category}).
    Compile a list of **at least 24 and no more than 40 books** from the Google Books tool only.

    You are given a VERIFIED_BOOKS seed catalog below. Prefer those IDs. Use the Google Books tool
    with refined sub-queries to expand coverage for 4–6 modules with ≥4 distinct readings each.

    VERIFIED_BOOKS:
    {verified_books}

    HARD RULES:
    - ONLY include books returned by the Google Books tool or listed in VERIFIED_BOOKS.
    - Never invent titles, authors, or links.
    - Every book MUST include its Google Books `ID`, title, authors, brief summary, and link.
    - Never include books without a valid ID and link.
    - Prefer unique titles; avoid near-duplicates.
    - Mark each book as Primary or Secondary when relevant.

    Category-specific search focus:
    - If category is history: prioritize primary sources (chronicles, letters, treatises, scripture,
      law codes, poetry, memoirs, speeches). Include at least 8 labeled primary sources.
    - If category is sciences: include both (a) foundational / historical works by field founders and
      (b) modern textbooks, handbooks, and practice-oriented titles.
    - If category is other: balanced introductory through advanced works; verified books only.
  expected_output: >
    A structured list of at least 24 books each with ID, title, author, brief summary, link,
    and Primary/Secondary label when applicable — all from Google Books / VERIFIED_BOOKS only.
  agent: librarian

course_creator_task:
  description: >
    Using ONLY the verified book list (with Google Books IDs) from the librarian, create a
    comprehensive course on {topic} (category: {category}).
    Break it into 4-6 logical modules.

    For each module include:
    - Module title
    - Learning objectives
    - Assigned readings (with google_books_id, title, authors, link) — **at least 4 real books**
    - Thoughtful written/research assignments that require reading those sources (not AI summaries)
    - `is_primary_sources_only`: boolean
    - `is_legacy_module`: boolean

    HARD RULES for readings:
    - Every reading MUST come from the librarian's verified list and MUST include `google_books_id`.
    - Never invent books or links. If a book is not on the list, do not use it.
    - Every module MUST have **at least 4** objects in `assigned_readings`.
    - Prefer distinct books across the course.

    Category rules (non-negotiable):
    - history: Include **at least one** module with `is_primary_sources_only: true` where every
      reading is a primary source (or faithful translation/edition). Objectives/assignments must
      interpret those period texts directly.
    - sciences: The **first** module MUST be a legacy/history-of-the-field module
      (`is_legacy_module: true`) with readings from founders or early foundational works.
      Later modules use modern textbooks and practice-oriented books (`is_legacy_module: false`).
      Primary-sources-only is not required for modern modules.
    - other: Balanced curriculum; no forced primary-only or legacy module; verified books only.

    Return ONLY a valid JSON object (no markdown) with this exact shape:
    {{
      "title": "string",
      "description": "string",
      "topic": "{topic}",
      "category": "{category}",
      "modules": [
        {{
          "module_title": "string",
          "learning_objectives": ["string"],
          "is_primary_sources_only": false,
          "is_legacy_module": false,
          "assigned_readings": [
            {{"title": "string", "authors": "string", "link": "string", "google_books_id": "string"}},
            {{"title": "string", "authors": "string", "link": "string", "google_books_id": "string"}},
            {{"title": "string", "authors": "string", "link": "string", "google_books_id": "string"}},
            {{"title": "string", "authors": "string", "link": "string", "google_books_id": "string"}}
          ],
          "assignments": [
            {{"assignment_title": "string", "description": "string"}}
          ]
        }}
      ]
    }}
  expected_output: >
    A valid JSON course with category-appropriate modules, at least 4 verified readings per module
    each including google_books_id, and no invented books.
  agent: course_creator
  context:
    - librarian_task
